x-airflow-common: &airflow-common
  image: apache/airflow:2.8.1
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres/airflow
    AIRFLOW__CORE__FERNET_KEY: '${AIRFLOW__CORE__FERNET_KEY}'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'true'
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__API__AUTH_BACKENDS: 'airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session'
    DOCKER_HOST: unix:///var/run/docker.sock
    _PIP_ADDITIONAL_REQUIREMENTS: apache-airflow-providers-docker
    
  env_file: .env
  volumes:
    - ./dags:/opt/airflow/dags
    - ./airflow-logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  group_add:
    - '983'
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:13
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5

  airflow-init:
    <<: *airflow-common
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -c
      - |
        mkdir -p /opt/airflow/logs /opt/airflow/dags
        chown -R 50000:0 /opt/airflow/logs
        exec gosu airflow bash -c "
          airflow db migrate &&
          airflow users create \
            --username admin \
            --password admin \
            --firstname Admin \
            --lastname User \
            --role Admin \
            --email admin@example.com || true
        "

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    restart: unless-stopped
    depends_on:
      airflow-init:
        condition: service_completed_successfully

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    ports:
      - "8082:8080"
    restart: unless-stopped
    depends_on:
      airflow-init:                          
        condition: service_completed_successfully

  ingestion:
    build:
      context: "."
      dockerfile: docker/Dockerfile.ingestion
    image: malaria-ingestion
    env_file: .env
    volumes:
      - ./logs:/app/logs
    restart: "no"

  transformation:
    build:
      context: "."
      dockerfile: docker/Dockerfile.transformation
    image: malaria-transformation
    env_file: .env
    volumes:
      - ./logs:/app/logs
    restart: "no"
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    ports:
      - "5000:5000"
    volumes:
      - mlflow_data:/mlflow
    command: >
      mlflow server
      --backend-store-uri sqlite:///mlflow/mlflow.db
      --default-artifact-root s3://malaria-forecast-bree/mlflow-artifacts/
      --host 0.0.0.0
    env_file: .env
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import sys, urllib.request; urllib.request.urlopen('http://localhost:5000/health', timeout=5).read(); sys.exit(0)"
        ]
      interval: 10s
      retries: 5
      start_period: 15s

  training:
    build:
      context: "."
      dockerfile: docker/Dockerfile.training
    image: malaria-training
    env_file: .env
    environment:
     
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./logs:/app/logs
    restart: "no"
    depends_on:
      mlflow:
        condition: service_healthy
        
volumes:
  postgres_data:
  mlflow_data: